[package]
name = "RustyFlow"
version = "0.1.0"
edition = "2024"
authors = ["Ian Viotti"]
description = "Unified GUI for Structured 2D O-Grid Mesh Generation (RustyMesher) and CFD Solvers (RustPotential)"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
ndarray = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
rfd = "0.15"
